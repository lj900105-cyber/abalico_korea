<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>ABALICO Korea</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100vh;
    }

    body {
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f3f8f9;
      color: #1f2a36;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 720px;
      background: #ffffff;
      border-radius: 28px;
      padding: 48px 44px 54px;
      text-align: center;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.08);
    }

    .logo {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 0.12em;
      margin-bottom: 16px;
    }

    .subtitle {
      font-size: 16px;
      color: #4d5f70;
      line-height: 1.6;
      margin: 0 0 38px;
    }

    .section-wrap {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .section-card {
      background: #f8fbfc;
      border: 1px solid #e1e9ee;
      border-radius: 22px;
      padding: 28px 22px 30px;
      text-align: center;

      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .section-title {
      font-size: 19px;
      font-weight: 700;
      color: #1f2a36;
      margin-bottom: 22px;
    }

    .button-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .select-button {
      width: 240px;
      min-height: 56px;
      padding: 0 18px;
      border-radius: 14px;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.35;
      text-align: center;

      display: flex;
      align-items: center;
      justify-content: center;

      white-space: normal;
      word-break: keep-all;
      transition: all 0.2s ease;
    }

    .select-button.ko {
      background: #243c5a;
      color: #ffffff;
    }

    .select-button.en {
      background: #ffffff;
      color: #243c5a;
      border: 1px solid #d9e3ea;
    }

    .select-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.1);
    }

    @media (max-width: 640px) {
      .container {
        padding: 42px 24px 46px;
      }

      .section-wrap {
        grid-template-columns: 1fr;
      }

      .select-button {
        width: 100%;
        max-width: 260px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="logo">ABALICO</div>

    <p class="subtitle">
      Please select the document you would like to view.<br />
      확인하실 자료를 선택해 주세요.
    </p>

    <div class="section-wrap">
      <section class="section-card">
        <div class="section-title">회사 소개서</div>

        <div class="button-group">
          <a class="select-button ko" href="./company/ko/">
            회사 소개서
          </a>

          <a class="select-button en" href="./company/en/">
            Company Profile
          </a>
        </div>
      </section>

      <section class="section-card">
        <div class="section-title">카탈로그</div>

        <div class="button-group">
          <a class="select-button ko" href="./ko/">
            한국어 카탈로그
          </a>

          <a class="select-button en" href="./en/">
            English Catalog
          </a>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
